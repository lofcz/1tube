name: Release
run-name: Release ${{ inputs.publish_npm && inputs.publish_onetube_cs && 'npm + OneTube.cs' || inputs.publish_npm && 'npm' || inputs.publish_onetube_cs && 'OneTube.cs' || 'nothing selected' }} (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish npm package
        required: true
        default: true
        type: boolean
      publish_onetube_cs:
        description: Publish OneTube.cs NuGet package
        required: true
        default: false
        type: boolean
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    env:
      ONETUBE_CS_PROJECT_PATH: dotnet/OneTube/OneTube.csproj
      ONETUBE_CS_TAG_PREFIX: onetube-cs-v

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate target selection
        if: ${{ !inputs.publish_npm && !inputs.publish_onetube_cs }}
        run: |
          echo "Select at least one release target."
          exit 1

      - name: Setup Node.js
        if: inputs.publish_npm
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        if: inputs.publish_npm
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        if: inputs.publish_npm
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.7.13"

      - name: Setup .NET
        if: inputs.publish_onetube_cs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.100"

      - name: Install npm dependencies
        if: inputs.publish_npm
        run: bun install --frozen-lockfile

      - name: Typecheck npm package
        if: inputs.publish_npm
        run: bun run typecheck

      - name: Smoke test npm package
        if: inputs.publish_npm
        run: bun run check

      - name: Bump npm package version
        if: inputs.publish_npm
        id: npm_version
        run: |
          npm version "${{ inputs.release_type }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bump OneTube.cs package version
        if: inputs.publish_onetube_cs
        id: onetube_cs_version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["ONETUBE_CS_PROJECT_PATH"])
          release_type = "${{ inputs.release_type }}"
          text = project.read_text(encoding="utf-8")
          match = re.search(r"<Version>([^<]+)</Version>", text)
          if not match:
              raise SystemExit(f"{project} does not contain a <Version> element")

          current = match.group(1).strip()
          semver = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current)
          if not semver:
              raise SystemExit(f"Only simple x.y.z package versions can be bumped automatically, got {current!r}")

          major, minor, patch = map(int, semver.groups())
          if release_type == "major":
              major, minor, patch = major + 1, 0, 0
          elif release_type == "minor":
              minor, patch = minor + 1, 0
          elif release_type == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unknown release_type {release_type!r}")

          new_version = f"{major}.{minor}.{patch}"
          updated = text[:match.start(1)] + new_version + text[match.end(1):]
          project.write_text(updated, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={new_version}\n")
              fh.write(f"tag={os.environ['ONETUBE_CS_TAG_PREFIX']}{new_version}\n")

      - name: Restore OneTube.cs
        if: inputs.publish_onetube_cs
        run: dotnet restore "$ONETUBE_CS_PROJECT_PATH"

      - name: Build OneTube.cs
        if: inputs.publish_onetube_cs
        run: dotnet build "$ONETUBE_CS_PROJECT_PATH" --configuration Release --no-restore

      - name: Pack OneTube.cs
        if: inputs.publish_onetube_cs
        run: dotnet pack "$ONETUBE_CS_PROJECT_PATH" --configuration Release --no-build --output nupkgs

      - name: Commit release version and create tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          SUMMARY=""
          if [ "${{ inputs.publish_npm }}" = "true" ]; then
            git add package.json
            SUMMARY="npm v${{ steps.npm_version.outputs.version }}"
          fi
          if [ "${{ inputs.publish_onetube_cs }}" = "true" ]; then
            git add "$ONETUBE_CS_PROJECT_PATH"
            if [ -n "$SUMMARY" ]; then
              SUMMARY="$SUMMARY and OneTube.cs v${{ steps.onetube_cs_version.outputs.version }}"
            else
              SUMMARY="OneTube.cs v${{ steps.onetube_cs_version.outputs.version }}"
            fi
          fi
          git commit -m "chore: release $SUMMARY"
          if [ "${{ inputs.publish_npm }}" = "true" ]; then
            git tag -a "${{ steps.npm_version.outputs.tag }}" -m "Release npm v${{ steps.npm_version.outputs.version }}"
          fi
          if [ "${{ inputs.publish_onetube_cs }}" = "true" ]; then
            git tag -a "${{ steps.onetube_cs_version.outputs.tag }}" -m "Release OneTube.cs v${{ steps.onetube_cs_version.outputs.version }}"
          fi

      - name: Publish to npm
        if: inputs.publish_npm
        run: npm publish --provenance --access public

      - name: Publish to NuGet
        if: inputs.publish_onetube_cs
        run: dotnet nuget push "nupkgs/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate

      - name: Push release commit and tag
        run: git push --follow-tags

      - name: Create npm GitHub release
        if: inputs.publish_npm
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.npm_version.outputs.tag }}
          name: npm v${{ steps.npm_version.outputs.version }}
          generate_release_notes: true

      - name: Create OneTube.cs GitHub release
        if: inputs.publish_onetube_cs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.onetube_cs_version.outputs.tag }}
          name: OneTube.cs v${{ steps.onetube_cs_version.outputs.version }}
          files: nupkgs/*.nupkg
          generate_release_notes: true
