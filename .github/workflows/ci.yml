name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C# build
            target: dotnet
          - name: TypeScript tests
            target: bun

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        if: matrix.target == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.100"

      - name: Restore OneTube.cs
        if: matrix.target == 'dotnet'
        run: dotnet restore dotnet/OneTube/OneTube.csproj

      - name: Build OneTube.cs
        if: matrix.target == 'dotnet'
        run: dotnet build dotnet/OneTube/OneTube.csproj --configuration Release --no-restore

      - name: Test OneTube.cs
        if: matrix.target == 'dotnet'
        run: dotnet test dotnet/OneTube.Tests --configuration Release

      - name: Setup Bun
        if: matrix.target == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        if: matrix.target == 'bun'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: matrix.target == 'bun'
        run: bun run typecheck

      - name: Run TypeScript tests
        if: matrix.target == 'bun'
        run: bun test
